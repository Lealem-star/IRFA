<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" fill="none">
  <defs>
    <linearGradient id="lSkyGrad" x1="250" y1="30" x2="250" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EAF4FC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <linearGradient id="lGearGrad" x1="120" y1="20" x2="380" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12315B" />
      <stop offset="100%" stop-color="#0A1D36" />
    </linearGradient>
    <linearGradient id="lDropGrad" x1="225" y1="55" x2="275" y2="165" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2CA5F5" />
      <stop offset="100%" stop-color="#106CB8" />
    </linearGradient>
    <linearGradient id="lWaveGrad" x1="160" y1="210" x2="340" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C8DE8" />
      <stop offset="100%" stop-color="#0C5298" />
    </linearGradient>
    <linearGradient id="lFieldGrad1" x1="160" y1="150" x2="340" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#349E48" />
      <stop offset="100%" stop-color="#237433" />
    </linearGradient>
    <linearGradient id="lFieldGrad2" x1="160" y1="170" x2="340" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#72BE44" />
      <stop offset="100%" stop-color="#4B9B32" />
    </linearGradient>
    <clipPath id="lCircleClip">
      <circle cx="250" cy="140" r="110" />
    </clipPath>
  </defs>

  <!-- ================= EMBLEM SYMBOL (TOP) ================= -->
  <g id="EmblemSymbol">
    <!-- Outer Mechanical Cog / Gear -->
    <path d="M 236,10 L 264,10 L 266,28 A 112,112 0 0,1 291,39 L 306,25 L 327,42 L 316,59 A 112,112 0 0,1 334,81 L 352,76 L 362,102 L 345,115 A 112,112 0 0,1 350,140 L 368,147 L 365,174 L 346,179 A 112,112 0 0,1 335,203 L 350,217 L 334,238 L 316,229 A 112,112 0 0,1 294,245 L 296,264 L 270,270 L 263,252 A 112,112 0 0,1 237,252 L 230,270 L 204,264 L 206,245 A 112,112 0 0,1 184,229 L 166,238 L 150,217 L 165,203 A 112,112 0 0,1 154,179 L 135,174 L 132,147 L 150,140 A 112,112 0 0,1 155,115 L 138,102 L 148,76 L 166,81 A 112,112 0 0,1 184,59 L 173,42 L 194,25 L 209,39 A 112,112 0 0,1 234,28 Z" fill="url(#lGearGrad)" />

    <!-- Inner Circle Base -->
    <circle cx="250" cy="140" r="110" fill="url(#lSkyGrad)" stroke="#FFFFFF" stroke-width="6" />

    <!-- Masked Inner Artwork -->
    <g clip-path="url(#lCircleClip)">
      <!-- Golden Sun with Rays -->
      <circle cx="272" cy="85" r="24" fill="#F4BA38" />
      <path d="M 272,52 L 272,45 M 291,59 L 297,54 M 303,77 L 310,75 M 304,95 L 311,99 M 293,111 L 299,116 M 253,60 L 247,55" stroke="#F4BA38" stroke-width="3.5" stroke-linecap="round" />

      <!-- Mountain Silhouette -->
      <path d="M 235,129 Q 261,91 287,99 T 340,125 L 362,155 L 220,155 Z" fill="#4B9ED8" opacity="0.6" />
      <path d="M 261,110 Q 291,88 314,101 T 362,132 L 362,170 L 250,170 Z" fill="#2E7EBA" opacity="0.4" />

      <!-- Irrigated Field Ridges -->
      <path d="M 152,185 Q 235,117 355,140 L 362,252 L 137,252 Z" fill="url(#lFieldGrad1)" />
      <path d="M 164,200 Q 242,136 355,151 L 362,252 L 145,252 Z" fill="url(#lFieldGrad2)" />
      <path d="M 175,215 Q 250,159 355,166 L 362,252 L 152,252 Z" fill="url(#lFieldGrad1)" />
      
      <!-- Furrow Lines -->
      <path d="M 186,191 Q 254,140 344,149" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.75" />
      <path d="M 197,204 Q 261,155 347,161" stroke="#FFFFFF" stroke-width="2.2" fill="none" opacity="0.75" />
      <path d="M 212,218 Q 272,171 351,176" stroke="#FFFFFF" stroke-width="2.2" fill="none" opacity="0.7" />

      <!-- Sprinkler Equipment -->
      <g transform="translate(287, 106)">
        <line x1="0" y1="30" x2="0" y2="8" stroke="#12315B" stroke-width="3.8" stroke-linecap="round" />
        <circle cx="0" cy="6" r="3.5" fill="#12315B" />
        <path d="M -3,5 Q -10,-3 -18,-1" stroke="#1686D9" stroke-width="2.2" fill="none" stroke-linecap="round" />
        <path d="M -1,3 Q -6,-9 -12,-12" stroke="#1686D9" stroke-width="2.2" fill="none" stroke-linecap="round" />
        <path d="M 1,3 Q 6,-9 12,-12" stroke="#1686D9" stroke-width="2.2" fill="none" stroke-linecap="round" />
        <path d="M 3,5 Q 10,-3 18,-1" stroke="#1686D9" stroke-width="2.2" fill="none" stroke-linecap="round" />
        <circle cx="-21" cy="-1" r="2" fill="#1686D9" />
        <circle cx="-14" cy="-14" r="2" fill="#1686D9" />
        <circle cx="14" cy="-14" r="2" fill="#1686D9" />
        <circle cx="21" cy="-1" r="2" fill="#1686D9" />
      </g>

      <!-- Center Water Droplet -->
      <path d="M 250,58 C 250,58 211,106 211,137 C 211,159 228,176 250,176 C 272,176 289,159 289,137 C 289,106 250,58 250,58 Z" fill="url(#lDropGrad)" stroke="#FFFFFF" stroke-width="3.8" />
      <path d="M 226,125 C 226,111 238,92 245,81 C 243,96 233,114 233,128 C 233,135 236,140 235,142 C 230,142 226,134 226,125 Z" fill="#FFFFFF" opacity="0.75" />

      <!-- River / Lake Waves Base -->
      <path d="M 137,222 C 182,192 227,241 272,219 C 302,204 332,223 362,207 L 362,260 L 137,260 Z" fill="#1686D9" opacity="0.9" />
      <path d="M 137,234 C 197,211 235,252 287,230 C 317,215 340,237 362,226 L 362,260 L 137,260 Z" fill="url(#lWaveGrad)" />
      <path d="M 145,228 C 182,209 224,243 269,224 C 299,212 329,228 355,216" stroke="#FFFFFF" stroke-width="2.2" fill="none" opacity="0.65" />

      <!-- Green Leaves on Left -->
      <g transform="translate(175, 121) rotate(-18)">
        <path d="M 0,45 C -26,22 -30,-11 19,-30 C 30,11 19,37 0,45 Z" fill="#2E8F43" stroke="#FFFFFF" stroke-width="2.6" />
        <path d="M 0,45 Q 4,8 19,-30" stroke="#FFFFFF" stroke-width="1.8" fill="none" opacity="0.7" />
        <path d="M -6,34 C -34,26 -41,0 -11,-15 C -2,8 -2,26 -6,34 Z" fill="#6CBF3E" stroke="#FFFFFF" stroke-width="2.2" />
      </g>
    </g>

    <circle cx="250" cy="140" r="110" stroke="#12315B" stroke-width="3.5" fill="none" />
  </g>

  <!-- ================= TYPOGRAPHY LOCKUP (BOTTOM) ================= -->
  <!-- IRFA Bold Title with Leaf Accent in 'A' -->
  <g id="IRFAText">
    <text x="250" y="380" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="82" font-weight="900" fill="#12315B" text-anchor="middle" letter-spacing="4">IRFA</text>
    <!-- Leaf detail inside 'A' triangle / leg -->
    <path d="M 333,366 C 343,353 358,350 357,364 C 350,372 338,374 333,366 Z" fill="#2F8B45" />
    <path d="M 333,366 Q 346,361 357,364" stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.8" />
  </g>

  <!-- Amharic Directorate Name -->
  <text x="250" y="434" font-family="'Noto Sans Ethiopic', 'Nyala', 'Abyssinica SIL', sans-serif" font-size="34" font-weight="800" fill="#12315B" text-anchor="middle" letter-spacing="1">ባህርዳር ግብርና መምሪያ</text>

  <!-- English Directorate Name -->
  <text x="250" y="474" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#12315B" text-anchor="middle" letter-spacing="0.5">Bahir Dar Agriculture Directorate</text>

  <!-- Decorative Separator Line with Green Leaf Sprig in Center -->
  <g id="DecorativeDivider">
    <line x1="70" y1="504" x2="225" y2="504" stroke="#1686D9" stroke-width="1.8" />
    <line x1="275" y1="504" x2="430" y2="504" stroke="#1686D9" stroke-width="1.8" />
    <!-- Two small center leaves -->
    <path d="M 248,504 C 242,496 233,497 236,505 C 241,509 246,507 248,504 Z" fill="#2F8B45" />
    <path d="M 252,504 C 258,496 267,497 264,505 C 259,509 254,507 252,504 Z" fill="#6CBF3E" />
  </g>

  <!-- Subtitle System Description -->
  <text x="250" y="538" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="500" fill="#1E5285" text-anchor="middle" letter-spacing="0.8">Irrigation Resource &amp; Fuel Authorization System</text>
</svg>